services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    user: "1000"
    environment:
      SHELL: /bin/zsh
    volumes:
      - ..:/workspace
      - command.history:/commandhistory
      - go.cache.mod:/home/hypnos/go/pkg/mod
      - go.cache.bin:/home/hypnos/.cache/go-build
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
          pids: 1024
volumes:
  command.history:
  go.cache.mod:
  go.cache.bin:
